[build]
  command = "pip install -r requirements.txt && python3 build.py"
  publish = "dist"

[build.environment]
  PYTHON_VERSION = "3.11"

# 下書きブランチのプレビュー（Deploy Previews / Branch deploys）では下書きも表示する
[context.branch-deploy]
  command = "pip install -r requirements.txt && python3 build.py --drafts"

[context.deploy-preview]
  command = "pip install -r requirements.txt && python3 build.py --drafts"
